name: ScreenForge

run-name: ScreenForge · ${{ github.ref_name }} 🎬

# The screen recorder in this repository (screen-forge/). Two jobs, because the
# two halves fail in different ways: the command lines and the file naming are
# platform neutral and are tested on Linux in seconds, while the window itself
# is WinForms and can only be compiled on Windows.
on:
  push:
    branches: [main]
    paths:
      - 'screen-forge/**'
      - '.github/workflows/screenforge.yml'
  pull_request:
    paths:
      - 'screen-forge/**'
      - '.github/workflows/screenforge.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'screenforge-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  logic-tests:
    name: Logic Tests 🧪
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Set Up .NET 🔧
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # In addition to pure logic, synthetic-media tests run the real ffmpeg mux
      # so an audio stream cannot silently shorten the output video.
      - name: Prepare ffmpeg for media tests 🎞️
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/ffmpeg-env"
          python="$RUNNER_TEMP/ffmpeg-env/bin/python"
          "$python" -m pip install --disable-pip-version-check imageio-ffmpeg==0.8.1
          ffmpeg_path="$("$python" -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          "$ffmpeg_path" -version
          echo "SCREENFORGE_FFMPEG=$ffmpeg_path" >> "$GITHUB_ENV"

      - name: Run Logic Tests 🧪
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          dotnet test screen-forge/tests/ScreenForge.Tests.csproj \
            --configuration Release \
            --nologo \
            --logger "console;verbosity=normal" \
            --logger "trx;LogFileName=results.trx" \
            --results-directory "$RUNNER_TEMP/results" 2>&1 | tee "$RUNNER_TEMP/tests.log"

      # A failing test run prints the reason in the middle of four hundred lines
      # of build output, and GitHub hides the log behind a click. These turn each
      # test run that fails into one annotation per failure, on the run summary.
      - name: Explain Failures 📣
        if: steps.tests.outcome == 'failure'
        shell: bash
        run: |
          trx="$RUNNER_TEMP/results/results.trx"

          if [ ! -f "$trx" ]; then
            echo "::error::No test results file — the project did not build. Last lines:"
            tail -20 "$RUNNER_TEMP/tests.log"
            exit 1
          fi

          python3 - "$trx" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          namespace = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          root = ET.parse(sys.argv[1]).getroot()

          failures = 0
          for result in root.iterfind(".//t:UnitTestResult", namespace):
              if result.get("outcome") != "Failed":
                  continue
              failures += 1
              message = result.find(".//t:Message", namespace)
              text = " ".join((message.text or "").split())[:350] if message is not None else ""
              name = (result.get("testName") or "").split(".")[-1]
              print(f"::error title={name}::{text}")

          print(f"::error::{failures} test(s) failed — the command lines or the numbers are wrong, not the runner.")
          PY

          exit 1

  build:
    name: Build Windows App 🧱
    runs-on: windows-latest
    needs: logic-tests
    timeout-minutes: 30
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Set Up .NET 🔧
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test native click indicators 🖱️
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "click-smoke.log"
          dotnet run --project screen-forge/windows-tests/ClickSmoke.csproj --configuration Release 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Get-Content $log | Select-Object -Last 25 | ForEach-Object {
              $line = $_.ToString().Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Click indicator smoke test::$line"
            }
            exit $code
          }

      - name: Publish 🧱
        shell: pwsh
        run: |
          dotnet publish screen-forge/src/ScreenForge.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output dist

          Copy-Item screen-forge/README.md dist/README.md
          Get-ChildItem dist | Format-Table Name, Length

          if (-not (Test-Path dist/ScreenForge.exe)) {
            Write-Error "the build produced no ScreenForge.exe"
            exit 1
          }

      # The user's half of the deal: ffmpeg is not in this repository (it is
      # 80 MB of somebody else's binary), so the artifact says where to put it.
      - name: Add the ffmpeg note 📝
        shell: pwsh
        run: |
          @'
          ScreenForge records through ffmpeg.

          FFMPEG IS NOT INCLUDED IN THIS ZIP.

          Put ffmpeg.exe in this same folder, next to ScreenForge.exe:

              1. Download ffmpeg-release-essentials.zip from https://www.gyan.dev/ffmpeg/builds/
              2. Open the zip, go into bin/ and copy ffmpeg.exe
              3. Paste it here, next to ScreenForge.exe
              4. Start ScreenForge.exe

          Any ffmpeg.exe from 2023 or later works. If you would rather not move
          files around, put ffmpeg.exe on your PATH instead — ScreenForge looks
          next to itself first, then %APPDATA%\ffmpeg, then PATH.
          '@ | Set-Content dist/PUT-FFMPEG-HERE.txt -Encoding UTF8

      # Publish the executable hash independently of the downloadable ZIP so a
      # reader can compare the extracted file with this specific Actions run.
      # A hash proves a match to the build, not that the program is safe or signed.
      - name: Publish executable checksum 🔎
        id: exe-checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 -Path dist/ScreenForge.exe).Hash.ToLowerInvariant()
          if ($hash -notmatch '^[0-9a-f]{64}$') { throw 'Invalid SHA-256 result' }
          "$hash  ScreenForge.exe" | Set-Content -Path dist/SHA256SUMS.txt -Encoding ascii
          $signature = (Get-AuthenticodeSignature -FilePath dist/ScreenForge.exe).Status
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          Write-Output "::notice title=ScreenForge.exe SHA-256::$hash"
          Write-Output "::notice title=Authenticode signature status::$signature"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '### ScreenForge.exe SHA-256'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "<code>$hash</code>"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Authenticode signature status on this runner: $signature."
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value 'This identifies the executable from this run. A matching hash does not prove that it is safe or digitally signed.'

      - name: Upload Artifact 📡
        uses: actions/upload-artifact@v4
        with:
          name: screenforge-windows-x64
          path: dist/
          if-no-files-found: error

      # Validate the bytes users actually download, not just the staging folder.
      - name: Download artifact for integrity check
        uses: actions/download-artifact@v4
        with:
          name: screenforge-windows-x64
          path: ${{ runner.temp }}/screenforge-integrity-check

      - name: Check downloaded executable hash
        shell: pwsh
        env:
          EXPECTED_SHA256: ${{ steps.exe-checksum.outputs.sha256 }}
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'screenforge-integrity-check'
          $actual = (Get-FileHash -Algorithm SHA256 -Path (Join-Path $folder 'ScreenForge.exe')).Hash.ToLowerInvariant()
          $checksumFile = (Get-Content -Raw -Path (Join-Path $folder 'SHA256SUMS.txt')).Trim()
          if ($actual -ne $env:EXPECTED_SHA256 -or $checksumFile -ne "$actual  ScreenForge.exe") {
            throw 'Uploaded executable or checksum does not match the published SHA-256.'
          }

  previous-artifact-check:
    name: Verify previous download (temporary)
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      actions: read
    steps:
      - name: Download prior main artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42470582061
          name: screenforge-windows-x64
          path: old-build
      - name: Identify previous executable
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Path old-build/ScreenForge.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $signature = (Get-AuthenticodeSignature -FilePath old-build/ScreenForge.exe).Status
          Write-Output "::notice title=Previous ScreenForge.exe SHA-256::$hash"
          Write-Output "::notice title=Previous Authenticode status::$signature"
