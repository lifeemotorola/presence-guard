name: ScreenForge

run-name: ScreenForge · ${{ github.ref_name }} 🎬

# The screen recorder in this repository (screen-forge/). Two jobs, because the
# two halves fail in different ways: the command lines and the file naming are
# platform neutral and are tested on Linux in seconds, while the window itself
# is WinForms and can only be compiled on Windows.
on:
  push:
    branches: [main]
    paths:
      - 'screen-forge/**'
      - '.github/workflows/screenforge.yml'
  pull_request:
    paths:
      - 'screen-forge/**'
      - '.github/workflows/screenforge.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: '${{ github.workflow }} @ ${{ github.ref }} @ ${{ github.sha }}'
  cancel-in-progress: true

jobs:
  logic-tests:
    name: Logic Tests 🧪
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Set Up .NET 🔧
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # In addition to pure logic, synthetic-media tests run the real ffmpeg mux
      # so an audio stream cannot silently shorten the output video.
      - name: Prepare ffmpeg for media tests 🎞️
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/ffmpeg-env"
          python="$RUNNER_TEMP/ffmpeg-env/bin/python"
          "$python" -m pip install --disable-pip-version-check imageio-ffmpeg==0.8.1
          ffmpeg_path="$("$python" -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          "$ffmpeg_path" -version
          echo "SCREENFORGE_FFMPEG=$ffmpeg_path" >> "$GITHUB_ENV"

      - name: Run Logic Tests 🧪
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          dotnet test screen-forge/tests/ScreenForge.Tests.csproj \
            --configuration Release \
            --nologo \
            --logger "console;verbosity=normal" \
            --logger "trx;LogFileName=results.trx" \
            --results-directory "$RUNNER_TEMP/results" 2>&1 | tee "$RUNNER_TEMP/tests.log"

      # A failing test run prints the reason in the middle of four hundred lines
      # of build output, and GitHub hides the log behind a click. These turn each
      # test run that fails into one annotation per failure, on the run summary.
      - name: Explain Failures 📣
        if: steps.tests.outcome == 'failure'
        shell: bash
        run: |
          trx="$RUNNER_TEMP/results/results.trx"

          if [ ! -f "$trx" ]; then
            echo "::error::No test results file — the project did not build. Last lines:"
            tail -20 "$RUNNER_TEMP/tests.log"
            exit 1
          fi

          python3 - "$trx" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          namespace = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          root = ET.parse(sys.argv[1]).getroot()

          failures = 0
          for result in root.iterfind(".//t:UnitTestResult", namespace):
              if result.get("outcome") != "Failed":
                  continue
              failures += 1
              message = result.find(".//t:Message", namespace)
              text = " ".join((message.text or "").split())[:350] if message is not None else ""
              name = (result.get("testName") or "").split(".")[-1]
              print(f"::error title={name}::{text}")

          print(f"::error::{failures} test(s) failed — the command lines or the numbers are wrong, not the runner.")
          PY

          exit 1

  build:
    name: Build Windows App 🧱
    runs-on: windows-latest
    needs: logic-tests
    timeout-minutes: 30
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Set Up .NET 🔧
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test native click indicators 🖱️
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "click-smoke.log"
          dotnet run --project screen-forge/windows-tests/ClickSmoke.csproj --configuration Release 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Get-Content $log | Select-Object -Last 25 | ForEach-Object {
              $line = $_.ToString().Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Click indicator smoke test::$line"
            }
            exit $code
          }

      - name: Publish 🧱
        shell: pwsh
        run: |
          dotnet publish screen-forge/src/ScreenForge.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output dist

          Copy-Item screen-forge/README.md dist/README.md
          Get-ChildItem dist | Format-Table Name, Length

          if (-not (Test-Path dist/ScreenForge.exe)) {
            Write-Error "the build produced no ScreenForge.exe"
            exit 1
          }

      # The user's half of the deal: ffmpeg is not in this repository (it is
      # 80 MB of somebody else's binary), so the artifact says where to put it.
      - name: Add the ffmpeg note 📝
        shell: pwsh
        run: |
          @'
          ScreenForge records through ffmpeg.

          FFMPEG IS NOT INCLUDED IN THIS ZIP.

          Put ffmpeg.exe in this same folder, next to ScreenForge.exe:

              1. Download ffmpeg-release-essentials.zip from https://www.gyan.dev/ffmpeg/builds/
              2. Open the zip, go into bin/ and copy ffmpeg.exe
              3. Paste it here, next to ScreenForge.exe
              4. Start ScreenForge.exe

          Any ffmpeg.exe from 2023 or later works. If you would rather not move
          files around, put ffmpeg.exe on your PATH instead — ScreenForge looks
          next to itself first, then %APPDATA%\ffmpeg, then PATH.
          '@ | Set-Content dist/PUT-FFMPEG-HERE.txt -Encoding UTF8

      - name: Upload Artifact 📡
        uses: actions/upload-artifact@v4
        with:
          name: screenforge-windows-x64
          path: dist/
          if-no-files-found: error

  diagnose-repository-builds:
    name: Diagnose repository builds (temporary)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    steps:
      - name: Summarize previous failed build logs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for job in 128696779034 128696778999; do
            if ! gh api --allow-escape-sequences "repos/${GITHUB_REPOSITORY}/actions/jobs/${job}/logs" > "${RUNNER_TEMP}/${job}.log" 2> "${RUNNER_TEMP}/diagnostic-error"; then
              while IFS= read -r line; do echo "::error title=Cannot read job $job::${line}"; done < "${RUNNER_TEMP}/diagnostic-error"
              exit 1
            fi
          done
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          for job in ('128696779034', '128696778999'):
              lines = Path(os.environ['RUNNER_TEMP'], f'{job}.log').read_text(errors='replace').splitlines()
              important = [l for l in lines if re.search(r'error|failed|failure|fatal|exception', l, re.I)]
              text = '\n'.join((important[-20:] + ['--- LAST LINES ---'] + lines[-20:]))
              safe = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::notice title=Job {job}::{safe}')
          PY

  diagnose-release-download:
    name: Diagnose dependency downloads (temporary)
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Probe upstream release asset
        shell: bash
        run: |
          python - <<'PY'
          import os, sys, urllib.request, urllib.error, urllib.parse
          system = os.environ['RUNNER_OS']
          name = 'windows-deps-2025-07-11-x64.zip' if system == 'Windows' else 'macos-deps-2025-07-11-universal.tar.xz'
          url = 'https://github.com/obsproject/obs-deps/releases/download/2025-07-11/' + name
          for label, suffix in [('standard', ''), ('fresh', '?probe=' + os.environ['GITHUB_RUN_ID'])]:
              try:
                  with urllib.request.urlopen(urllib.request.Request(url + suffix, method='HEAD'), timeout=90) as response:
                      result = f'HTTP {response.status}, host {urllib.parse.urlsplit(response.url).hostname}'
              except urllib.error.HTTPError as error:
                  body = error.read(300).decode('utf-8', 'replace').replace('\n', ' ')
                  result = f'HTTP {error.code}, host {urllib.parse.urlsplit(error.url).hostname}, {body}'
              except Exception as error:
                  result = f'{type(error).__name__}: {error}'
              print(f'::notice title={system} {label} dependency probe::{result}')
          PY
