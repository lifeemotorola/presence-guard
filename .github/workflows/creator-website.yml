name: Creator Toolkit website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/creator-website.yml'
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/creator-website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'creator-website-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  test:
    name: Test catalog and website
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install test dependency
        run: npm ci --prefix website --no-audit --no-fund
      - name: Test catalog and publisher
        run: npm test --prefix website
      - name: Test website in Chromium
        run: |
          CHROMIUM_PATH="$(command -v google-chrome || command -v chromium)"
          test -n "$CHROMIUM_PATH"
          CHROMIUM_PATH="$CHROMIUM_PATH" npm run test:browser --prefix website

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check whether Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" > "$RUNNER_TEMP/pages.json" 2> "$RUNNER_TEMP/pages-error.txt"; then
            if jq -e '.build_type == "workflow"' "$RUNNER_TEMP/pages.json" > /dev/null; then
              echo 'enabled=true' >> "$GITHUB_OUTPUT"
            else
              echo '::notice::In Settings > Pages, select GitHub Actions as the source, then run this workflow again.'
            fi
          elif grep -q 'HTTP 404' "$RUNNER_TEMP/pages-error.txt"; then
            echo '::notice::Enable Pages in Settings > Pages, select GitHub Actions as the source, then run this workflow again.'
          else
            cat "$RUNNER_TEMP/pages-error.txt"
            exit 1
          fi
      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.enabled == 'true'
      - name: Prepare static website
        if: steps.pages.outputs.enabled == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/creator-site"
          cp website/index.html website/styles.css website/app.js website/catalog.js "$RUNNER_TEMP/creator-site/"
          cp -R website/assets "$RUNNER_TEMP/creator-site/assets"
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: ${{ runner.temp }}/creator-site
      - name: Deploy
        id: deployment
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
