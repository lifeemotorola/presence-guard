name: OnAirTwin
run-name: OnAirTwin · ${{ github.ref_name }}

on:
  push:
    branches: [main]
    paths:
      - 'onair-twin/**'
      - '.github/workflows/onair-twin-windows.yml'
  pull_request:
    paths:
      - 'onair-twin/**'
      - '.github/workflows/onair-twin-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: '${{ github.workflow }} @ ${{ github.ref }}'
  cancel-in-progress: true

defaults:
  run:
    working-directory: onair-twin

jobs:
  model-tests:
    name: Rehearsal and snapshot tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run model and fake-OBS adapter tests
        run: ./tests/run-tests.sh

  windows-build:
    name: Windows x64 / OBS 33.0.1
    needs: model-tests
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: pwsh
        run: |
          cmake --preset windows-x64 -DBUILD_TWIN_TESTS=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build
        shell: pwsh
        run: |
          cmake --build --preset windows-x64 --config RelWithDebInfo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test report, baseline and dock
        shell: pwsh
        run: |
          # Exercise the real widget against fake OBS using the SDK's own
          # Windows Qt platform plugin. Mixing another Qt build's platform DLL
          # can fail even when both distributions report the same Qt version.
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $qtCore = Get-ChildItem .deps -Recurse -Filter Qt6Core.dll | Select-Object -First 1
          $windowsPlatform = Get-ChildItem .deps -Recurse -Filter qwindows.dll | Select-Object -First 1
          if (!$qtCore -or !$windowsPlatform) {
            Write-Host '::error::The OBS Qt SDK runtime or Windows platform plugin is missing.'
            exit 1
          }
          Write-Host "::notice::Qt runtime: $($qtCore.FullName); Windows platform: $($windowsPlatform.FullName)"
          $env:PATH = "$(Split-Path $qtCore.FullName);$env:PATH"
          $env:QT_QPA_PLATFORM = 'windows'
          $env:QT_DEBUG_PLUGINS = '1'
          $env:QT_FORCE_STDERR_LOGGING = '1'
          $env:QT_QPA_PLATFORM_PLUGIN_PATH = Split-Path $windowsPlatform.FullName
          $env:ONAIRTWIN_UI_SCREENSHOT = Join-Path $env:RUNNER_TEMP 'onair-twin-dock.png'
          function Invoke-Test([string] $exe) {
            $tag = [IO.Path]::GetFileNameWithoutExtension($exe)
            $outFile = Join-Path $env:RUNNER_TEMP "$tag.out.txt"
            $errFile = Join-Path $env:RUNNER_TEMP "$tag.err.txt"
            $process = Start-Process -FilePath (Resolve-Path $exe).Path -NoNewWindow -PassThru -RedirectStandardOutput $outFile -RedirectStandardError $errFile
            if (!$process.WaitForExit(60000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              $detail = ((Get-Content $outFile -Raw -ErrorAction SilentlyContinue) + "`n" + (Get-Content $errFile -Raw -ErrorAction SilentlyContinue))
              $escaped = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Host "::error title=Test timeout::$tag timed out after 60 seconds. $escaped"
              exit 1
            }
            $detail = ((Get-Content $outFile -Raw -ErrorAction SilentlyContinue) + "`n" + (Get-Content $errFile -Raw -ErrorAction SilentlyContinue))
            Write-Host $detail
            if ($process.ExitCode -ne 0) {
              $escaped = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Host "::error title=Test failure::$tag exited $($process.ExitCode). $escaped"
              exit 1
            }
          }
          Invoke-Test '.\build_x64\RelWithDebInfo\onair-twin-qt-tests.exe'
          Invoke-Test '.\build_x64\RelWithDebInfo\onair-twin-ui-tests.exe'
      - name: Assemble installable package
        shell: pwsh
        run: |
          $install = "$env:RUNNER_TEMP\install"
          cmake --install build_x64 --config RelWithDebInfo --prefix $install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $package = "$install\obs-onair-twin"
          if (!(Test-Path "$package\bin\64bit\obs-onair-twin.dll")) { throw 'Plugin DLL missing.' }
          if (!(Test-Path "$package\data\locale\en-US.ini")) { throw 'Locale data missing.' }
          Copy-Item windows\Install.ps1, windows\Install.bat, windows\Uninstall.ps1, windows\Uninstall.bat, README.md, LICENSE $package
          $sha = '${{ github.event.pull_request.head.sha || github.sha }}'
          "Source corresponding to this build: https://github.com/${{ github.repository }}/tree/$sha/onair-twin`nGPL-2.0-or-later; see LICENSE." |
            Set-Content -Encoding UTF8 "$package\SOURCE-CODE.txt"
          $hash = (Get-FileHash "$package\bin\64bit\obs-onair-twin.dll" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  obs-onair-twin.dll" | Set-Content -Encoding ASCII "$package\SHA256SUMS.txt"
          "### OnAirTwin DLL`nSHA-256: ``$hash```nBuilt for OBS 33.0.1 headers. This build is unsigned." >> $env:GITHUB_STEP_SUMMARY
      - name: Smoke-test packaged DLL in OBS 33.0.1
        shell: pwsh
        run: |
          & .\tests\real-obs-smoke.ps1 -PackagePath "$env:RUNNER_TEMP\install\obs-onair-twin"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows plugin
        uses: actions/upload-artifact@v4
        with:
          name: obs-onair-twin-windows-x64
          path: ${{ runner.temp }}/install/obs-onair-twin/
          if-no-files-found: error
      - name: Upload UI test screenshot
        uses: actions/upload-artifact@v4
        with:
          name: onair-twin-ui-test
          path: ${{ runner.temp }}/onair-twin-dock.png
          if-no-files-found: error
