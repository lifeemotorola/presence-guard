name: Printable guides

on:
  push:
    branches: [main]
    paths:
      - 'docs/generate-guides.py'
      - 'docs/test_guides.py'
      - 'docs/presence-guard-*.pdf'
      - '.github/workflows/guides.yml'
  pull_request:
    paths:
      - 'docs/generate-guides.py'
      - 'docs/test_guides.py'
      - 'docs/presence-guard-*.pdf'
      - '.github/workflows/guides.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify printable guides 📘
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install guide tools
        run: python -m pip install --disable-pip-version-check reportlab==4.4.10 pypdf==6.1.3
      - name: Check committed and regenerated PDFs
        run: python -m unittest discover -s docs -p 'test_guides.py' -v
