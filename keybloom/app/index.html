<html lang="en">
<head>

  <title>KeyBloom — Your typing studio</title>

  <script src="content.js" defer></script>
  <script src="engine.js" defer></script>
  <script src="ui.js" defer></script>
</head>
<body>
  <svg class="svg-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3.5 10.5 12 3l8.5 7.5v9a1 1 0 0 1-1 1h-5v-6h-5v6h-5a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 6.4c-2.2-2-5.2-2.5-8-1.3v13c2.8-1.2 5.8-.7 8 1.3m0-13c2.2-2 5.2-2.5 8-1.3v13c-2.8-1.2-5.8-.7-8 1.3m0-13v13"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="m13.2 2.8-8 10h6.1l-.5 8.4 8-10h-6.1z"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20h16M6 16v-4m6 4V6m6 10v-7"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 13.2v-2.4l-1.7-.5-.6-1.4.9-1.6-1.7-1.7-1.6.9-1.5-.6-.5-1.7h-2.4l-.5 1.7-1.4.6-1.6-.9-1.7 1.7.9 1.6-.6 1.4-1.7.5v2.4l1.7.5.6 1.4-.9 1.6 1.7 1.7 1.6-.9 1.4.6.5 1.7h2.4l.5-1.7 1.5-.6 1.6.9 1.7-1.7-.9-1.6.6-1.4z"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M20 12H5m6-6-6 6 6 6"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.5 2"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 2 1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4.5 4.5L19 7"/></symbol>
    <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12.2 2.8c.9 4-2.8 4.6-2.1 8.1.6-1.1 1.4-1.8 2.2-2.5.1 2.7 3.1 3.5 3.1 6.6a3.4 3.4 0 0 1-6.8 0c0-1.7.5-3.1 1.2-4.3C5.9 12.9 5 15.3 5 16.6a7 7 0 1 0 14 0c0-4.6-3-7.6-6.8-13.8z"/></symbol>
    <symbol id="i-keyboard" viewBox="0 0 24 24"><rect x="2.5" y="5.5" width="19" height="13" rx="2"/><path d="M6 9h.1M10 9h.1M14 9h.1M18 9h.1M6 12h.1M10 12h.1M14 12h.1M18 12h.1M8 15h8"/></symbol>

    <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></symbol>
    <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M5 19c1-7 5-11 14-14 .5 8-2.5 14-9 14-2 0-3.5-.7-5-2M5 19c3-3.4 5.8-5.8 9-8"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M19 8a7.5 7.5 0 0 0-13-2L3.5 8.5M5 16a7.5 7.5 0 0 0 13 2l2.5-2.5M3.5 4v4.5H8M20.5 20v-4.5H16"/></symbol>
  </svg>

  <div class="shell">
    <aside class="sidebar" aria-label="Main navigation">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><span></span><i></i><b></b></div>
        <div><div class="brand-name">keybloom<span>.</span></div><div class="brand-sub">YOUR TYPING STUDIO</div></div>
      </div>
      <div class="nav-caption">YOUR SPACE</div>
      <nav class="nav-list" aria-label="Pages">
        <button class="nav-item" data-action="navigate" data-screen="home"><svg><use href="#i-home"/></svg><span>Overview</span></button>
        <button class="nav-item" data-action="navigate" data-screen="lessons"><svg><use href="#i-book"/></svg><span>Lessons</span><span class="nav-number" aria-hidden="true">21</span></button>
        <button class="nav-item" data-action="navigate" data-screen="practice"><svg><use href="#i-bolt"/></svg><span>Practice</span></button>
        <button class="nav-item" data-action="navigate" data-screen="progress"><svg><use href="#i-chart"/></svg><span>My progress</span></button>
      </nav>
      <div class="nav-caption second-caption">PREFERENCES</div>
      <nav class="nav-list" aria-label="Preferences">
        <button class="nav-item" data-action="navigate" data-screen="settings"><svg><use href="#i-gear"/></svg><span>Settings</span></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="sidebar-card">
          <div class="side-card-top"><span class="side-card-icon"><svg><use href="#i-leaf"/></svg></span><span>GROW AT YOUR PACE</span></div>
          <p>Small steps.<br><strong>Big progress.</strong></p>
          <div class="side-card-detail">A little practice goes a long way.</div>
        </div>
        <div class="private-note"><svg><use href="#i-shield"/></svg><span>Private &amp; offline<br><small>Saved on this device</small></span></div>
      </div>
    </aside>
    <main class="workspace" id="workspace" tabindex="-1">
      <div id="storage-warning" class="storage-warning" role="status" hidden></div>
      <div id="view" class="view"></div>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="confirm-dialog" aria-labelledby="dialog-title" aria-describedby="dialog-message">
    <div class="dialog-icon"><svg><use href="#i-spark"/></svg></div>
    <h2 id="dialog-title"></h2>
    <p id="dialog-message"></p>
    <div class="dialog-actions"><button class="btn btn-subtle" id="dialog-cancel">Cancel</button><button class="btn btn-dark" id="dialog-confirm">Continue</button></div>
  </dialog>
</body>
</html>
